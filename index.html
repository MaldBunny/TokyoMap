<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tokyo Atlas · KP's first-trip map</title>
<meta name="description" content="Interactive map of Japan and Tokyo: 23 wards, neighbourhoods, sights, train lines and the route from Narita.">
<meta name="theme-color" content="#d93b3b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=Instrument+Serif:ital@0;1&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d93b3b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='white'/%3E%3C/svg%3E">
<style>:root{
  --bg:#f3f1ec; --panel:rgba(255,255,255,.985); --panel-solid:#fff; --ink:#15171c; --ink2:#3a3e47; --muted:#737884;
  --line:rgba(20,22,28,.09); --chip:rgba(20,22,28,.05); --chip-h:rgba(20,22,28,.09);
  --accent:#d93b3b; --accent-soft:rgba(217,59,59,.1); --gold:#e6a700;
  --shadow:0 10px 40px -12px rgba(20,22,28,.28),0 2px 8px -2px rgba(20,22,28,.08);
  --r:18px; --pw:408px;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --fj:'Noto Sans JP','Hiragino Sans',sans-serif; --fd:'Instrument Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0f13; --panel:rgba(20,22,28,.985); --panel-solid:#16181d; --ink:#eef0f4; --ink2:#c9ccd3; --muted:#8d929d;
  --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.06); --chip-h:rgba(255,255,255,.11);
  --accent:#ff5c5c; --accent-soft:rgba(255,92,92,.14);
  --shadow:0 12px 40px -10px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.jp{font-family:var(--fj);font-weight:500}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:var(--f)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font-size:10px;border-radius:8px 0 0 0;}
.leaflet-control-attribution a{color:var(--muted)!important}

/* ---------- Panel ---------- */
#panel{position:fixed;z-index:1000;top:12px;left:12px;bottom:12px;width:var(--pw);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px -4px var(--accent)}
.logo i{width:14px;height:14px;border-radius:50%;background:#fff;display:block}
.brand b{font-family:var(--fd);font-size:24px;font-weight:400;letter-spacing:-.2px;line-height:1}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.search{position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--chip);padding:0 12px 0 36px;outline:none;font-size:14px}
.search input:focus{border-color:var(--accent);background:var(--panel-solid)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;stroke:var(--muted)}
#results{position:absolute;left:0;right:0;top:46px;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:340px;overflow:auto;display:none;z-index:5;padding:6px}
#results.on{display:block}
.res{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;width:100%;text-align:left}
.res:hover,.res.sel{background:var(--chip-h)}
.res .dot{width:10px;height:10px;border-radius:50%;flex:none}
.res .t{flex:1;min-width:0}.res .t b{font-weight:600}.res .t span{color:var(--muted);margin-left:6px;font-size:12px}
.res em{font-style:normal;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.crumbs{display:flex;align-items:center;gap:4px;margin-top:10px;flex-wrap:wrap;font-size:12.5px}
.crumbs button{padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--ink2);font-weight:500}
.crumbs button:hover{background:var(--chip-h)}
.crumbs button.cur{background:var(--ink);color:var(--panel-solid)}
.crumbs .sep{color:var(--muted);font-size:11px}
.pb{flex:1;overflow:auto;overscroll-behavior:contain;padding:18px 18px 28px}
.pb::-webkit-scrollbar{width:8px}.pb::-webkit-scrollbar-thumb{background:var(--chip-h);border-radius:8px}
.handle{display:none}

/* ---------- Typography in panel ---------- */
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
h1{font-family:var(--fd);font-weight:400;font-size:38px;line-height:1.02;letter-spacing:-.5px;margin:0 0 4px}
h1 .jp{font-size:20px;color:var(--muted);margin-left:8px;letter-spacing:0;font-weight:400}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.lede{font-size:15px;line-height:1.55;color:var(--ink2);margin:8px 0 0}
.lede b{color:var(--ink)}
p.s{color:var(--ink2);line-height:1.55;margin:6px 0}
.card{background:var(--chip);border-radius:14px;padding:14px;border:1px solid var(--line)}
.card+.card{margin-top:10px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;margin-top:18px;box-shadow:0 8px 24px -8px var(--accent);transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.cta.ghost{background:var(--chip);color:var(--ink);box-shadow:none;height:42px;font-size:14px;margin-top:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;margin-bottom:12px;font-size:13px}
.back:hover{color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin:16px 0 4px;position:sticky;top:-18px;z-index:3;}
.tabs button{flex:1;height:34px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--panel-solid);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tabs .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#000;font-size:10.5px;margin-left:4px;padding:0 5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--chip);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--fd);font-size:28px;font-weight:400;line-height:1}
.stat span{font-size:11.5px;color:var(--muted)}
.compbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:12px 0 6px;gap:2px}
.compbar i{display:block}
.complegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.complegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}

/* islands */
.isl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.isl button{display:grid;grid-template-columns:92px 1fr 70px;align-items:center;gap:10px;text-align:left;padding:6px 8px;border-radius:10px}
.isl button:hover{background:var(--chip)}
.isl b{font-weight:600}.isl .jp{color:var(--muted);font-size:11px;display:block;font-weight:400}
.bar{height:8px;border-radius:5px;background:var(--chip-h);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--c,var(--accent))}
.isl em{font-style:normal;color:var(--muted);font-size:11.5px;text-align:right}

/* travel list */
.tl{display:flex;flex-direction:column;gap:2px}
.tli{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 8px;border-radius:12px;text-align:left;width:100%}
.tli:hover{background:var(--chip)}
.tli svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tli .nm b{font-weight:600}.tli .nm .jp{color:var(--muted);font-size:11.5px;margin-left:6px;font-weight:400}
.tli .nm .bar{margin-top:6px;height:5px}
.tli .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;text-align:right;min-width:52px}
.tli .tm small{display:block;color:var(--muted);font-weight:400;font-size:10.5px}

/* line strip */
.strip{overflow-x:auto;margin:8px -14px -4px;padding:6px 14px 10px}
.strip ol{display:flex;list-style:none;margin:0;padding:0;position:relative;min-width:max-content}
.strip ol::before{content:"";position:absolute;left:12px;right:12px;top:13px;height:5px;border-radius:3px;background:var(--lc)}
.strip li{position:relative;width:64px;text-align:center;font-size:10.5px;color:var(--ink2);flex:none}
.strip li i{display:block;width:13px;height:13px;border-radius:50%;background:var(--panel-solid);border:3px solid var(--lc);margin:9px auto 6px;position:relative;z-index:1}
.strip li.home i{width:20px;height:20px;margin:5px auto 3px;background:var(--accent);border-color:var(--panel-solid);box-shadow:0 0 0 3px var(--accent)}
.strip li.home{font-weight:700;color:var(--ink)}
.strip li b{display:block;font-weight:700;color:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
.strip li span{display:block;line-height:1.2}

/* steps */
.steps{list-style:none;margin:10px 0 0;padding:0;position:relative}
.steps li{position:relative;padding:0 0 14px 30px}
.steps li::before{content:"";position:absolute;left:8px;top:18px;bottom:-2px;width:3px;border-radius:2px;background:var(--sc,var(--line))}
.steps li:last-child::before{display:none}
.steps li i{position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--panel-solid);border:3px solid var(--sc,var(--muted))}
.steps li:last-child i{background:var(--accent);border-color:var(--accent)}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted);font-size:12.5px;line-height:1.45;display:block;margin-top:2px}
.steps em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink2);background:var(--chip-h);padding:1px 7px;border-radius:6px;margin-left:6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip:hover{background:var(--chip-h)}
.chip .jp{color:var(--muted);font-size:11px;font-weight:400}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.off{opacity:.38}
.chip.on{background:var(--ink);color:var(--panel-solid);border-color:var(--ink)}
.chip svg{width:14px;height:14px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ward grid */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcard{text-align:left;padding:10px 12px 11px;border-radius:12px;background:var(--chip);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .12s}
.wcard:hover{transform:translateY(-1px);background:var(--chip-h)}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.wcard b{font-weight:650;display:block}.wcard .jp{font-size:11.5px;color:var(--muted);font-weight:400}
.wcard small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.wcard.home{outline:2px solid var(--accent);outline-offset:-2px}

/* place list */
.plist{display:flex;flex-direction:column;gap:4px}
.pli{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:7px;border-radius:14px;text-align:left;width:100%}
.pli:hover{background:var(--chip)}
.thumb{width:54px;height:54px;border-radius:11px;background:var(--c) center/cover no-repeat;display:grid;place-items:center;position:relative;overflow:hidden}
.thumb svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.thumb.img svg{display:none}
.pli .nm b{font-weight:600;display:block;line-height:1.25}
.pli .nm small{color:var(--muted);font-size:11.5px}
.pli .nm .jp{font-size:11.5px;color:var(--muted);font-weight:400}
.tpill{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;background:var(--tc);color:#fff;white-space:nowrap}
.star{color:var(--gold)}
.mayflag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--accent);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;color:var(--muted);font-size:12px}
.sortrow button{color:var(--ink);font-weight:600;padding:4px 8px;border-radius:8px;background:var(--chip)}

/* hero (place / ward) */
.hero{margin:-18px -18px 16px;height:220px;background:var(--c) center/cover no-repeat;position:relative;display:flex;align-items:flex-end}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.hero .ic{position:absolute;inset:0;display:grid;place-items:center}
.hero .ic svg{width:64px;height:64px;fill:none;stroke:rgba(255,255,255,.7);stroke-width:1.4}
.hero.img .ic{display:none}
.hero .hb{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:2}
.hero .hb button{height:34px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.hero .credit{position:absolute;right:10px;bottom:8px;z-index:2;font-size:10px;color:rgba(255,255,255,.8);text-decoration:none}
.hero .cat{position:absolute;left:14px;bottom:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--c);color:#fff;font-size:12px;font-weight:600}
.hero .cat svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
.titleblock h1{font-size:34px}
.titleblock .jpn{font-family:var(--fj);font-size:17px;color:var(--muted);margin-top:2px}
.wardlink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;background:var(--chip)}
.wardlink i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.maynote{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:13px;line-height:1.5}
.maynote b{color:var(--accent);display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.info{display:grid;gap:10px;margin-top:16px}
.irow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.irow>svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.irow b{font-weight:600}
.irow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.lb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 7px 2px 3px;border-radius:6px;background:var(--chip-h);margin:4px 4px 0 0}
.lb i{display:inline-grid;place-items:center;min-width:20px;height:16px;border-radius:4px;background:var(--c);color:#fff;font-style:normal;font-size:9.5px;padding:0 3px}
.timebig{display:flex;align-items:baseline;gap:6px}
.timebig b{font-family:var(--fd);font-size:30px;font-weight:400;line-height:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.actions a,.actions button{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;background:var(--chip);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px}
.actions .saved{background:var(--gold);border-color:var(--gold);color:#1a1300}
.actions svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions .saved svg{fill:currentColor}
.wardhead{margin:-18px -18px 16px;padding:24px 18px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 34%,transparent),color-mix(in srgb,var(--c) 6%,transparent));border-bottom:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent);color:#fff;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.6}
.empty svg{width:36px;height:36px;stroke:var(--gold);fill:none;stroke-width:1.6;margin-bottom:8px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}

/* ---------- Floating map controls ---------- */
.fab{position:fixed;z-index:900;display:flex;gap:8px}
#topright{top:12px;right:12px;flex-direction:column;align-items:flex-end}
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px;box-shadow:var(--shadow);border:1px solid var(--line)}
.seg button{height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--ink);color:var(--panel-solid)}
.round{width:44px;height:44px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);display:grid;place-items:center}
.round svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#zoom{right:12px;bottom:28px;flex-direction:column}
#layersBtn{gap:8px;width:auto;padding:0 14px;display:flex;font-weight:600}
#layers{position:fixed;z-index:950;top:112px;right:12px;width:290px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:8px;display:none}
#layers.on{display:block}
.lt{display:grid;grid-template-columns:28px 1fr 38px;gap:10px;align-items:center;padding:8px;border-radius:10px;width:100%;text-align:left}
.lt:hover{background:var(--chip)}
.lt .sw{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--chip)}
.lt .sw svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.lt b{font-weight:600;font-size:13px;display:block}.lt small{color:var(--muted);font-size:11px}
.tog{width:36px;height:22px;border-radius:11px;background:var(--chip-h);position:relative;transition:.15s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.lt.on .tog{background:var(--accent)}.lt.on .tog::after{left:17px}
.legend{padding:8px 8px 4px;border-top:1px solid var(--line);margin-top:4px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:3px 0}
.legend i{width:22px;height:5px;border-radius:3px;background:var(--c)}
#hint{position:fixed;z-index:900;left:calc(var(--pw) + 24px);right:0;margin:auto;width:max-content;max-width:calc(100vw - var(--pw) - 40px);bottom:28px;background:var(--ink);color:var(--panel-solid);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;transition:opacity .4s, transform .4s}
#hint.hide{opacity:0;transform:translateY(10px);pointer-events:none}

@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

/* ---------- Map labels & markers ---------- */
.lbl{pointer-events:none;white-space:nowrap}
.lbl>div{transform:translate(-50%,-50%);text-align:center}
.wl{display:none}

.wl span{display:block;font-family:var(--fj);font-size:11px;font-weight:700;color:var(--ink2);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.big-wl .wl b{font-size:15px}.big-wl .wl span{font-size:12px}
.focus .wl:not(.cur){opacity:.35}
.nl{display:none}
.show-nl .nl{display:block}
.nl>div{transform:translate(-4px,-50%);text-align:left;display:flex;align-items:center;gap:5px}
.nl i{width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--bg);flex:none}
.nl b{font-size:12px;font-weight:650;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 5px var(--bg)}
.nl span{font-family:var(--fj);font-size:10.5px;color:var(--ink2);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.pl-n{display:none}
.pref-l{display:none}.show-prefl .pref-l{display:block}
.pref-l b{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-shadow:0 0 3px var(--bg)}
.pref-l span{display:block;font-family:var(--fj);font-size:10px;color:var(--muted)}
.isl-l b{font-family:var(--fd);font-size:22px;font-style:italic;font-weight:400;color:var(--ink2);text-shadow:0 0 4px var(--bg),0 0 4px var(--bg)}
.isl-l span{display:block;font-family:var(--fj);font-size:11px;color:var(--muted)}

.pm{cursor:pointer}
.pm>div{transform:translate(-50%,-50%);position:relative}
.pm .pin{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 3px 10px -2px rgba(0,0,0,.45);transition:transform .15s}
.pm .pin svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pm:hover .pin{transform:scale(1.15)}
.pm .pn{position:absolute;left:50%;top:34px;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:650;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);display:none;pointer-events:none}
.show-pn .pm .pn{display:block}
.small-pm .pm .pin{width:13px;height:13px;border-width:2px}
.small-pm .pm .pin svg{display:none}
.pm.saved .pin{box-shadow:0 0 0 3px var(--gold),0 3px 10px -2px rgba(0,0,0,.45)}
.pm.sel .pin{transform:scale(1.35);box-shadow:0 0 0 4px var(--panel-solid),0 0 0 7px var(--c),0 6px 16px rgba(0,0,0,.4);z-index:5}
.small-pm .pm.sel .pin{width:30px;height:30px}.small-pm .pm.sel .pin svg{display:block}
.pm.hidden{display:none}
.hide-pm .pm{display:none}

.hotel>div{transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.hotel .hp{background:var(--accent);color:#fff;font-weight:700;font-size:12px;padding:6px 10px;border-radius:10px;box-shadow:0 6px 18px -4px var(--accent);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hotel .hp svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hotel .hp .jp{opacity:.85;font-size:11px}
.hotel .tip{width:0;height:0;border:6px solid transparent;border-top-color:var(--accent);margin-top:-1px}
.hotel .ring{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;margin-top:2px;animation:ping 1.6s infinite}
.st-l{display:none}.show-st .st-l{display:block}
.st-l>div{transform:translate(-50%,-50%);position:relative}
.city.nolabel .cl{display:none}
.st-l i{display:block;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--c);margin:0 auto}
.st-l b{display:none;position:absolute;left:12px;top:-3px;font-size:10.5px;font-weight:600;color:var(--ink2);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.show-stn .st-l b{display:block}
.city>div{transform:translate(-6px,-6px);display:flex;align-items:center;gap:7px;cursor:pointer}
.city i{width:12px;height:12px;border-radius:50%;background:var(--panel-solid);border:3px solid var(--ink);flex:none;transition:transform .15s}
.city:hover i{transform:scale(1.3)}
.city .cl{background:var(--panel);border:1px solid var(--line);padding:4px 8px 4px 8px;border-radius:9px;box-shadow:0 3px 10px -4px rgba(0,0,0,.3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.city .cl b{font-weight:650;font-size:12px}
.city .cl .jp{font-size:10.5px;color:var(--muted);font-weight:400}
.city .cl em{font-style:normal;font-size:10.5px;font-weight:700;background:var(--chip-h);padding:1px 6px;border-radius:5px;display:flex;align-items:center;gap:3px}
.city .cl em svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2}
.city.trip i{border-color:var(--accent);border-radius:3px;transform:rotate(45deg)}
.city.trip:hover i{transform:rotate(45deg) scale(1.3)}
.tokyo-big>div{transform:translate(-50%,-50%);cursor:pointer;position:relative}
.tokyo-big .core{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 0 var(--accent);animation:ping 1.6s infinite;margin:auto}
.tokyo-big .tag{position:absolute;left:24px;top:50%;transform:translateY(-50%);background:var(--accent);color:#fff;padding:7px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 8px 24px -6px var(--accent)}

.air>div{transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap}
.air .ai{width:26px;height:26px;border-radius:8px;background:#005aaa;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.air .ai svg{width:14px;height:14px;fill:#fff}
.air b{font-size:12px;font-weight:700;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 5px var(--bg)}
.leaflet-tooltip.wt{background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 10px;font-family:var(--f);font-size:12.5px}
.leaflet-tooltip.wt::before{display:none}
.wt b{font-weight:700}.wt .jp{color:var(--muted);margin-left:4px}.wt small{display:block;color:var(--muted);font-size:11px}

/* ---------- Mobile: bottom sheet ---------- */
@media (max-width:760px){
  :root{--pw:0px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:var(--sh,46vh);border-radius:22px 22px 0 0;transition:height .28s cubic-bezier(.2,.8,.2,1);border-bottom:0}
  #panel.drag{transition:none}
  .handle{display:block;height:22px;flex:none;cursor:grab;touch-action:none;position:relative}
  .handle::after{content:"";position:absolute;left:50%;top:9px;width:42px;height:5px;border-radius:3px;background:var(--chip-h);transform:translateX(-50%)}
  .ph{padding:0 14px 10px}
  .brand{margin-bottom:10px}.brand b{font-size:21px}.logo{width:30px;height:30px}
  .pb{padding:14px 14px 40px}
  .hero{margin:-14px -14px 14px;height:190px}.wardhead{margin:-14px -14px 14px}
  h1{font-size:32px}
  #topright{top:calc(10px + env(safe-area-inset-top))}
  #zoom{display:none}
  #layers{top:calc(64px + env(safe-area-inset-top));width:auto;left:12px;max-height:calc(100vh - var(--sh,46vh) - 80px);overflow:auto}
  #topright{flex-direction:row;left:12px;justify-content:space-between}
  #hint{left:0;bottom:calc(var(--sh,46vh) + 12px);max-width:calc(100vw - 30px)}
  .tabs{top:-14px}
}

.city.up>div{flex-direction:column-reverse;transform:translate(-50%,calc(-100% + 6px));gap:4px}
.city.down>div{flex-direction:column;transform:translate(-50%,-6px);gap:4px}
.city.left>div{flex-direction:row-reverse;transform:translate(calc(-100% + 6px),-6px)}
.show-stn .nl.dupst{display:none}
.st-l b{display:none}
.show-stn .st-l b{display:block}
@media (max-width:760px){ #panel.compact .brand{display:none} #panel.compact .ph{padding-top:2px} .tokyo-big .tag small{display:none} }
.tiny-c .city .cl em,.tiny-c .city .cl .jp{display:none}
.leaflet-interactive:focus,.leaflet-marker-icon:focus{outline:none}
.mid-z .tokyo-big .tag{display:none}

.city .cl{flex-direction:column;align-items:flex-start;gap:1px}
.city .cl .r1{display:flex;align-items:center;gap:6px}
.pp{display:none;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.2px}
.show-pp .pp,.city.trip .pp{display:block}
.tokyo-big .tag .pp{display:block;color:#fff;opacity:.85}
.pf-l{display:none}.show-pf .pf-l{display:block}
.pf-l b{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.pf-l span{display:block;font-family:var(--fj);font-size:10px;color:var(--muted);text-shadow:0 0 3px var(--bg)}
.mu-l{display:none}.show-muc .mu-c,.show-mut .mu-t{display:block}
.mu-l b{font-size:11.5px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg)}
.mu-l span{display:block;font-family:var(--fj);font-size:10px;color:var(--ink2);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.addr{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px}
.addr .sep{color:var(--muted)}
.addr-b{font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--panel-solid)}
.addr-b .jp{opacity:.7;font-weight:400}
.addr-s{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.addr-s i{width:9px;height:9px;border-radius:3px;background:var(--c,var(--muted))}

button.addr-s:hover{background:var(--chip-h)}
.notTokyo{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);border:1px dashed var(--muted);font-size:13px;line-height:1.5}
.notTokyo svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;margin-top:1px}
.names .nrow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:6px 0}

.sfx b{font-family:var(--fj);font-size:13px;color:var(--ink);margin-right:2px}
.tk-l{display:none}.show-tk .tk-l{display:block}
.tk-l b{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:800;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.tk-l span{display:block;font-family:var(--fj);font-size:10.5px;color:var(--accent);text-shadow:0 0 3px var(--bg)}

#panel{transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
.collapsed #panel{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
.collapse{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}

#openPanel{position:fixed;z-index:1001;top:12px;left:12px;height:48px;padding:0 14px 0 8px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transform:translateX(-12px);transition:.25s}
#openPanel .logo{width:32px;height:32px}

#openPanel svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2}
.collapsed #openPanel{opacity:1;pointer-events:auto;transform:none}
.collapsed #hint{left:0}
.leaflet-container{touch-action:none}
@media (max-width:760px){ .collapse{transform:rotate(-90deg)} #openPanel{display:none} }
</style>
</head>

  if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function inGeom(ll, g){ const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
  return polys.some(p => pip(ll[1], ll[0], p[0]) && !p.slice(1).some(h => pip(ll[1], ll[0], h))); }
function locate(ll){
  for (const w of WARDS) if (inGeom(ll, w.g)) return {ward:w.code};
  for (const t of GEO.tama) if (inGeom(ll, t.g)) return {tama:t.en, tamaJa:t.ja};
  let best=null, bd=.03; for (const w of WARDS){ const d=Math.hypot(w.lab[0]-ll[0], w.lab[1]-ll[1]); if(d<bd){bd=d;best=w;} }
  return best ? {ward:best.code} : {out:true};
}
function geomArea(g){ const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates; let a=0;
  polys.forEach(p => { const r=p[0]; let s=0; for(let i=0,j=r.length-1;i<r.length;j=i++) s += (r[j][0]+r[i][0])*(r[j][1]-r[i][1]);
    const lat=r[0][1]*Math.PI/180; a += Math.abs(s/2)*111.32*111.32*Math.cos(lat); }); return a; }
WARDS.forEach(w => w.area = geomArea(w.g));

}

/* ================= Smooth trackpad / wheel ================= */
(() => {
  const el = map.getContainer(); let dz = 0, pan = [0,0], pt = null, raf = 0, lastMouse = 0;
  const flush = () => { raf = 0;
    if (pan[0] || pan[1]){ map.panBy(pan, {animate:false}); pan = [0,0]; }
    if (dz){ const z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + dz)); dz = 0; map.setZoomAround(pt, z, {animate:false}); } };
  el.addEventListener("wheel", e => {
    if (e.target.closest && e.target.closest("#panel,#layers")) return;
    e.preventDefault();
    const line = e.deltaMode === 1, k = line ? 18 : 1;
    const mouse = !e.ctrlKey && (line || (e.wheelDeltaY && Math.abs(e.wheelDeltaY) % 120 === 0 && !e.deltaX && Math.abs(e.deltaY) >= 50));
    pt = map.mouseEventToContainerPoint(e);
    if (mouse){ const now = Date.now(); if (now - lastMouse < 90) return; lastMouse = now;
      const z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + (e.deltaY < 0 ? .5 : -.5)));
      map.setZoomAround(pt, z, {animate:true}); return; }
    if (e.ctrlKey) dz += -e.deltaY * k * .013;          // pinch
    else { pan[0] += e.deltaX * k; pan[1] += e.deltaY * k; }  // two-finger scroll = pan
    if (!raf) raf = requestAnimationFrame(flush);
  }, {passive:false});
  // Safari pinch
  let gz = null;
  el.addEventListener("gesturestart", e => { e.preventDefault(); gz = map.getZoom(); pt = map.mouseEventToContainerPoint(e); });
  el.addEventListener("gesturechange", e => { e.preventDefault(); if (gz == null) return;
    const z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), gz + Math.log2(e.scale)));
    dz = z - map.getZoom(); if (!raf) raf = requestAnimationFrame(flush); });
  el.addEventListener("gestureend", e => { e.preventDefault(); gz = null; });
})();

const panelW = () => document.body.classList.contains("collapsed") ? 0 : $("#panel").getBoundingClientRect().width;
const sheetH = () => isMobile() ? $("#panel").getBoundingClientRect().height : 0;
function pad(){ return isMobile() ? {paddingTopLeft:[16,70], paddingBottomRight:[16, sheetH()+16]} : {paddingTopLeft:[panelW()+40, 70], paddingBottomRight:[70,30]}; }
function flyB(b, o={}){ map.flyToBounds(b, {...pad(), duration:1.1, ...o}); }
function flyPt(ll, z){ const p = map.project(ll, z);
  if (isMobile()) p.y += sheetH()/2 - 30; else p.x -= (panelW()+12)/2;
  map.flyTo(map.unproject(p, z), z, {duration:1}); }

/* ================= Photos (Wikipedia) ================= */
const photoCache = {};
function getPhoto(title, q){
  if (photoCache[title]) return photoCache[title];
  return photoCache[title] = (async () => {
    try { const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title.replace(/ /g,"_")));
      if (r.ok){ const j = await r.json(); const o = j.originalimage, th = j.thumbnail;
        if (th || o){ let big = o && o.width <= 1000 ? o.source : th ? th.source.replace(/\/\d+px-/, "/960px-") : o.source;
          if (th && o && o.width < 960) big = o.source;
          return {thumb: th ? th.source : o.source, big, page: j.content_urls?.desktop?.page}; } } } catch(e){}
    try { const u = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=960&gsrsearch=" + encodeURIComponent(q || title);
      const j = await (await fetch(u)).json(); const pg = j.query && Object.values(j.query.pages)[0];
      if (pg && pg.thumbnail) return {thumb: pg.thumbnail.source.replace(/\/\d+px-/, "/320px-"), big: pg.thumbnail.source, page: pg.fullurl}; } catch(e){}
    return null; })();
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); loadThumb(e.target); } }), {root:null, rootMargin:"200px"}) : null;
function loadThumb(el){ getPhoto(el.dataset.wk, el.dataset.q).then(ph => { if (ph){ const im = new Image(); im.onload = () => { el.style.backgroundImage = `url("${ph.thumb}")`; el.classList.add("img"); }; im.src = ph.thumb; } }); }
function hydrate(root){
  root.querySelectorAll(".thumb[data-wk]").forEach(el => io ? io.observe(el) : loadThumb(el));
  const h = root.querySelector(".hero[data-wk]");
  if (h) getPhoto(h.dataset.wk, h.dataset.q).then(ph => { if (!ph || !h.isConnected) return; const im = new Image();
    im.onload = () => { h.style.backgroundImage = `url("${ph.big}")`; h.classList.add("img"); const c = h.querySelector(".credit"); if (c && ph.page){ c.href = ph.page; c.hidden = false; } };
    im.onerror = () => { im.onerror = null; im.src = ph.thumb; }; im.src = ph.big; });
}

/* ================= Panel rendering ================= */
const body = $("#pb"), panel = $("#panel");
function show(v, push=true){
  if (push && view && !(view.type===v.type && view.id===v.id && view.code===v.code)) stack.push(view);
  view = v;
  if (v.type !== "ward" && v.type !== "place") { if (focusWard){ focusWard=null; restyleWards(); markWardLabel(); } }
  const html = v.type==="japan" ? rJapan() : v.type==="tokyo" ? rTokyo(v.tab||"overview") : v.type==="ward" ? rWard(v.code)
            : v.type==="place" ? rPlace(v.id) : v.type==="city" ? rCity(v.id, v.trip) : "";
  panel.classList.toggle("compact", v.type !== "japan");
  if (["place","ward","city"].includes(v.type) && document.body.classList.contains("collapsed")) document.body.classList.remove("collapsed");
  body.innerHTML = html; body.scrollTop = 0; hydrate(body); crumbs(); syncMarkers(); updateSeg();
  if (v.anchor){ const a = body.querySelector("#"+v.anchor); if (a) setTimeout(() => a.scrollIntoView({behavior:"smooth", block:"start"}), 60); }
}
function back(){ const v = stack.pop(); if (!v) return goJapan(); show(v, false); camFor(v); }
function camFor(v){
  if (v.type==="japan") flyB(JAPAN_B); else if (v.type==="tokyo") flyB(TOKYO_B);
  else if (v.type==="ward"){ focusWard=v.code; restyleWards(); markWardLabel(); flyB(WARD[v.code].layer.getBounds()); }
  else if (v.type==="place") flyPt(P[v.id].ll, Math.max(map.getZoom(), 15));
  else if (v.type==="city"){ const c = (v.trip?DAYTRIPS:CITIES).find(x=>x.id===v.id); flyPt(c.ll, v.trip ? 9 : 7); }
}
function crumbs(){
  const c = [`<button data-a="japan" class="${view.type==='japan'||view.type==='city'?'cur':''}">Japan</button>`];
  if (view.type!=="japan" && view.type!=="city") c.push(`<span class="sep">›</span><button data-a="tokyo" class="${view.type==='tokyo'?'cur':''}">Tokyo</button>`);
  if (view.type==="city"){ const x=(view.trip?DAYTRIPS:CITIES).find(x=>x.id===view.id); c.push(`<span class="sep">›</span><button class="cur">${esc(x.n)}</button>`); }
  const wc = view.type==="ward" ? view.code : view.type==="place" ? P[view.id].ward : null;
  if (wc) c.push(`<span class="sep">›</span><button data-a="ward:${wc}" class="${view.type==='ward'?'cur':''}">${esc(WARD[wc].en)}</button>`);
  if (view.type==="place") c.push(`<span class="sep">›</span><button class="cur">${esc(P[view.id].n)}</button>`);
  $("#crumbs").innerHTML = c.join("");
}
const backBtn = () => stack.length ? `<button class="back" data-a="back">${svg(ICON.back,'width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"')}Back</button>` : "";
const lineBadges = codes => codes.map(c => { const l = LINECODES[c]; return l ? `<span class="lb" style="--c:${l.c}"><i>${c}</i>${esc(l.n)}</span>` : ""; }).join("");

function placeItem(p){
  const c = CATS[p.c];
  return `<button class="pli" data-a="place:${p.id}"><span class="thumb" style="--c:${c.c}" data-wk="${esc(p.wk)}" data-q="${esc(p.n+" Tokyo")}">${svg(c.i)}</span>
    <span class="nm"><b>${esc(p.n)}${saved.has(p.id)?' <span class="star">★</span>':''}${p.may?'<span class="mayflag">MAY</span>':''}</b><span class="jp">${esc(p.ja)}</span><br><small>${esc(placeArea(p))} · ${esc(c.n)}</small></span>
    <span class="tpill" style="--tc:${timeColor(p.t)}">${p.t}′</span></button>`;
}
const placeList = arr => arr.length ? `<div class="plist">${arr.map(placeItem).join("")}</div>` : `<div class="empty">Nothing here with the current filters.</div>`;

function rJapan(){
  const maxA = Math.max(...ISLANDS.map(i=>i.km));
  const tl = (arr, trip) => `<div class="tl">${arr.slice().sort((a,b)=>a.t-b.t).map(c => `<button class="tli" data-a="${trip?'trip':'city'}:${c.id}">${modeIcon(c.m)}
    <span class="nm"><b>${esc(c.n)}</b><span class="jp">${esc(c.ja)}</span><span class="bar" style="--c:${timeColor(c.t/4)}"><i style="width:${Math.min(100,c.t/300*100)}%"></i></span></span>
    <span class="tm">${fmtMin(c.t)}<small>${Math.round(km([35.6812,139.7671], c.ll))} km</small></span></button>`).join("")}</div>`;
  return `<div class="eyebrow">Step 1 · Orientation</div>
  <h1>Where is Tokyo?</h1>
  <p class="lede">Japan is an arc of islands about <b>3,000 km</b> long. Tokyo sits on the east coast of <b>Honshu</b>, the main island, roughly halfway along. Kyoto and Osaka are about 400 km south-west of it, Hiroshima further still.</p>
  <button class="cta" data-a="tokyo">Zoom into Tokyo ${svg('<path d="M5 12h14M13 6l6 6-6 6"/>','width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"')}</button>
  <h2>How Japanese place names work</h2>
  <div class="card names">
    <div class="nrow"><span class="lvl">Big</span><div><b>Prefecture</b>: 47 of them, like states.<div class="sfx"><span><b>都</b> to · Tokyo</span><span><b>道</b> dō · Hokkaido</span><span><b>府</b> fu · Osaka, Kyoto</span><span><b>県</b> ken · the other 43</span></div></div></div>
    <div class="nrow"><span class="lvl s">Small</span><div><b>Municipality</b>, inside a prefecture.<div class="sfx"><span><b>市</b> shi · city</span><span><b>区</b> ku · ward</span><span><b>町</b> machi · town</span><span><b>村</b> mura · village</span></div></div></div>
    <p class="note" style="margin:10px 0 0">So an address reads big → small, e.g. <b>Tokyo › Taito ward</b> (your hotel), <b>Yamanashi › Fujikawaguchiko town</b> (Mt Fuji), <b>Kyoto › Kyoto city</b>. Big cities often share their prefecture's name.</p>
  </div>
  <h2>The five main islands</h2>
  <div class="isl">${ISLANDS.map((i,k) => `<button data-a="island:${k}"><span><b>${esc(i.n)}</b><span class="jp">${esc(i.ja)}</span></span>
    <span class="bar" style="--c:${i.n==='Honshu'?css('--accent'):css('--muted')}"><i style="width:${Math.max(2,i.km/maxA*100)}%"></i></span><em>${i.km.toLocaleString()} km²</em></button>`).join("")}</div>
  <h2>From Tokyo: cities you've heard of</h2>${tl(CITIES)}
  <h2>Easy day trips from Tokyo</h2>${tl(DAYTRIPS, true)}
  <p class="note">Times are typical fastest journeys from central Tokyo by Shinkansen (bullet train), regular train, bus or plane, not counting airport waits. The dotted red lines on the map are the Shinkansen routes.</p>`;
}

function hibiyaStrip(){
  const li = LINES.find(l=>l.id==="H"), i0 = li.st.findIndex(s=>s[0]==="Iriya");
  const mins = [ -6,-4,-2,0,2,4,6,8,9,11,13,14,15,16,17,19,21,23,25,28,30,33 ];
  return `<div class="strip" style="--lc:${li.c}"><ol>${li.st.map((s,k) => `<li class="${k===i0?'home':''}"><i></i><b>${k===i0?'You':Math.abs(mins[k])+'′'}</b><span>${esc(s[0])}</span></li>`).join("")}</ol></div>`;
}

  let h = `<div class="eyebrow">Step 2 · The city</div><h1>Tokyo<span class="jp">東京都</span></h1>
    <div class="tabs">${tabs.map(([k,n]) => `<button data-a="tab:${k}" class="${tab===k?'on':''}">${n}</button>`).join("")}</div>`;
  if (tab === "overview"){
    const mayPl = PLACES.filter(p=>p.may);
    h += `<p class="lede">Tokyo isn't one city. It's a <b>metropolis</b> (都 <i>to</i>) made up of <b>23 special wards</b> (区 <i>ku</i>), which is the city you'll actually explore, plus suburban cities to the west and some far-off islands.</p>

    <div class="complegend"><span style="--c:${css('--accent')}">23 wards · 627 km²</span><span style="--c:${css('--muted')}">Tama area · 26 cities + towns</span><span style="--c:${css('--line')}">Islands</span></div>
    <div class="stats"><div class="stat"><b>23</b><span>wards (coloured on the map)</span></div><div class="stat"><b>${HOODS.length}</b><span>neighbourhoods labelled</span></div><div class="stat"><b>${PLACES.length}</b><span>places to visit</span></div></div>
    <h2 id="base">Your base</h2>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><div><b style="font-size:16px">Iriya <span class="jp" style="color:var(--muted);font-weight:400">入谷</span></b><div style="color:var(--muted);font-size:12.5px;margin-top:2px">Taito ward · between Ueno and Asakusa</div></div>
      <button class="chip" data-a="hotel">${svg(ICON.pin,'style="--c:var(--accent)"')}Show</button></div>
      <p class="s" style="font-size:13px">Two stations nearby: <b>Iriya</b> on the Hibiya Line (right there) and <b>Uguisudani</b> on the JR Yamanote loop (about 8 min walk). Times below are from Iriya on the Hibiya Line:</p>

      <div style="font-size:12.5px;color:var(--muted)">Total: about 60–75 min.</div>
      <button class="cta ghost" data-a="shownarita">Show the route on the map</button></div>

  }

  }

  return h;
}

function rWard(code){
  const w = WARD[code], i = WARDS.indexOf(w)+1, hoods = HOODS.filter(h => h.ward===code), pl = PLACES.filter(p => p.ward===code).sort((a,b)=>a.t-b.t);
  return `<div class="wardhead" style="--c:${w.color}">${backBtn()}
    <div class="eyebrow" style="color:${w.color}">Tokyo › ward ${i} of 23 · ${WARD_GROUPS[w.info.g].split(":")[0]}</div>
    <h1>${esc(w.en)}<span class="jp">${esc(w.ja)}</span></h1>
    ${code===13106?`<span class="badge">${svg(ICON.bed,'width="14" height="14" fill="none" stroke="#fff" stroke-width="2.2"')}Your hotel is in this ward</span>`:""}
    <p class="lede">${esc(w.info.d)}</p>
    <div class="stats"><div class="stat"><b>${Math.round(w.area)}</b><span>km²</span></div><div class="stat"><b>${hoods.length}</b><span>neighbourhoods</span></div><div class="stat"><b>${pl.length}</b><span>places</span></div></div></div>
    ${hoods.length?`<h2>Neighbourhoods</h2><div class="chips">${hoods.map(h => `<button class="chip" data-a="hood:${h.i}"><b>${esc(h[0])}</b><span class="jp">${esc(h[1])}</span></button>`).join("")}</div>`:""}
    <h2>Places to visit</h2>${pl.length ? placeList(pl) : `<div class="empty">Mostly residential, with no headline sights. Good for seeing everyday Tokyo.</div>`}`;
}

  const gm = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${p.n} ${p.ja} Tokyo`);
  return `<div class="hero" style="--c:${c.c}" data-wk="${esc(p.wk)}" data-q="${esc(p.n+' Tokyo')}"><div class="ic">${svg(c.i)}</div>
    <div class="hb">${stack.length?`<button data-a="back">${svg(ICON.back,'width="15" height="15" fill="none" stroke="#fff" stroke-width="2.4"')}Back</button>`:"<span></span>"}<button data-a="zoomto:${id}">${svg(ICON.pin,'width="15" height="15" fill="none" stroke="#fff" stroke-width="2"')}On map</button></div>
    <span class="cat">${svg(c.i)}${esc(c.n)}</span><a class="credit" target="_blank" rel="noopener" hidden>Photo · Wikipedia</a></div>
    <div class="titleblock"><h1>${esc(p.n)}</h1><div class="jpn">${esc(p.ja)}</div>
    ${addrHtml(p, true)}</div>
    <p class="lede">${esc(p.d)}</p>
    ${p.may?`<div class="maynote"><b>During your trip</b>${esc(p.may)}</div>`:""}
    <div class="info">
      <div class="irow">${svg(ICON.train)}<div><b>Nearest station: ${esc(p.st)}</b><div>${lineBadges(p.ln)}</div></div></div>
      <div class="irow">${svg(ICON.clock)}<div><div class="timebig"><b>≈${p.t}</b><span>min from your hotel</span></div>
        <div class="bar" style="--c:${timeColor(p.t)};margin-top:8px"><i style="width:${Math.min(100,p.t/100*100)}%"></i></div><small>${esc(p.how)}</small></div></div>

    ${others.length?`<h2>Nearby in ${esc(w.en)}</h2>${placeList(others)}`:""}`;

  const c = (trip?DAYTRIPS:CITIES).find(x=>x.id===id);

    <div class="hb">${stack.length?`<button data-a="back">${svg(ICON.back,'width="15" height="15" fill="none" stroke="#fff" stroke-width="2.4"')}Back</button>`:"<span></span>"}<span></span></div>
    <span class="cat" style="--c:rgba(0,0,0,.45)">${trip?"Day trip from Tokyo":"City"}</span><a class="credit" target="_blank" rel="noopener" hidden>Photo · Wikipedia</a></div>
    <div class="titleblock"><h1>${esc(c.n)}</h1><div class="jpn">${esc(c.ja)}</div>${addrHtml(c)}</div>
    <p class="lede">${esc(c.d)}</p>
    ${c.pf!=="Tokyo"?`<div class="notTokyo">${svg(ICON.pin)}<span><b>Not in Tokyo.</b> It's in ${esc(c.pf)} prefecture${c.note?". "+esc(c.note):"."}</span></div>`:""}
    <div class="stats"><div class="stat"><b>${fmtMin(c.t)}</b><span>${c.m==="fly"?"flight":c.m==="bus"?"by bus":"by train"} from Tokyo</span></div><div class="stat"><b>${Math.round(km([35.6812,139.7671], c.ll))}</b><span>km from Tokyo</span></div><div class="stat"><b>${compass([35.6812,139.7671], c.ll)}</b><span>direction from Tokyo</span></div></div>
    <button class="cta" data-a="tokyo">Back to Tokyo</button>`;
}

/* ================= Navigation ================= */
function goJapan(){ stack.length = 0; show({type:"japan"}, false); flyB(JAPAN_B, {duration:1.3}); hint("Tap the red <b>Tokyo</b> pin to dive in"); }
function goTokyo(tab="overview", toHotel=false, anchor){
  show({type:"tokyo", tab, anchor}, view.type!=="tokyo");
  if (toHotel) flyPt(HOTEL.ll, 14.5);
  else if (anchor === "narita") flyB(L.latLngBounds([...NARITA.rail, HOTEL.ll]));
  else flyB(TOKYO_B, {duration:1.2});
  hint("Tap any coloured <b>ward</b> to explore it");
}
function openWard(code){
  focusWard = code; restyleWards(); markWardLabel();
  show({type:"ward", code}); flyB(WARD[code].layer.getBounds(), {maxZoom:14.5});
  if (isMobile()) sheet("mid");
}
function markWardLabel(){ WARDS.forEach(w => { const el = w.lbl.getElement && w.lbl.getElement(); if (el) el.classList.toggle("cur", w.code===focusWard); }); map.getContainer().classList.toggle("focus", !!focusWard); onZoomLite(); }
function onZoomLite(){ const z=map.getZoom(); map.getContainer().classList.toggle("show-nl", layersOn.hoods && (z>=13 || (focusWard && z>=12.25))); }
function openPlace(id, fly=true){
  const p = P[id];
  if (p.ward && focusWard !== p.ward){ focusWard = p.ward; restyleWards(); markWardLabel(); }
  show({type:"place", id});
  if (fly || map.getZoom() < 14) flyPt(p.ll, Math.max(map.getZoom(), 15));
  else flyPt(p.ll, map.getZoom());
  if (isMobile()) sheet("mid");
}
function openCity(id, trip){
  const c = (trip?DAYTRIPS:CITIES).find(x=>x.id===id);
  show({type:"city", id, trip}); flyPt(c.ll, trip ? Math.max(8.5, Math.min(map.getZoom(), 9.5)) : 7);
  if (isMobile()) sheet("mid");
}

/* ================= Actions (delegated) ================= */
const ACT = {
  japan: () => goJapan(), tokyo: () => goTokyo(), back: () => back(),
  tab: t => { view.tab = t; show(view, false); },
  ward: c => openWard(+c), place: id => openPlace(id), city: id => openCity(id,false), trip: id => openCity(id,true),
  island: k => flyPt(ISLANDS[+k].ll, +k===4 ? 8 : +k===1 ? 5.75 : 6.75),
  hood: i => { const h = HOODS[+i];
    if (h.ward){ focusWard = h.ward; restyleWards(); markWardLabel(); if (!(view.type==="ward" && view.code===h.ward)) show({type:"ward", code:h.ward}); }
    flyPt([h[2],h[3]], 15.25); if (isMobile()) sheet("min"); },
  zoomto: id => flyPt(P[id].ll, 16.25),
  hotel: () => flyPt(HOTEL.ll, 15),
  save: id => { saved.has(id) ? saved.delete(id) : saved.add(id); store.set("tm-saved", [...saved]); show(view, false); },
  cat: k => { catOn.has(k) ? catOn.delete(k) : catOn.add(k); store.set("tm-cats", [...catOn]); show(view, false); },
  catall: () => { catOn = catOn.size===Object.keys(CATS).length ? new Set() : new Set(Object.keys(CATS)); store.set("tm-cats", [...catOn]); show(view, false); },
  sort: () => { sortBy = sortBy==="time" ? "name" : "time"; show(view, false); },
  showloop: () => { setLayer("lines", true); const li = LINES[0]; flyB(L.latLngBounds(li.st.map(s=>[s[2],s[3]]))); },
  shownarita: () => { setLayer("narita", true); flyB(L.latLngBounds([...NARITA.rail, HOTEL.ll])); },
  copysaved: (v, b) => { const txt = PLACES.filter(p=>saved.has(p.id)).map(p => `★ ${p.n} (${p.ja}), ${addrText(p)}: ${p.st} Stn, ≈${p.t} min from Iriya`).join("\n");
    navigator.clipboard?.writeText(txt).then(() => { b.textContent = "Copied ✓"; }, () => { b.textContent = "Copy not allowed here"; }); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const [a, ...rest] = b.dataset.a.split(":"); if (ACT[a]){ e.preventDefault(); ACT[a](rest.join(":"), b); closeSearch(); }
});

/* ================= Search ================= */
const IDX = [
  ...WARDS.map(w => ({k:"Ward", n:w.en, ja:w.ja, c:w.color, a:`ward:${w.code}`})),
  ...PLACES.map(p => ({k:"Place", n:p.n, ja:p.ja, c:CATS[p.c].c, a:`place:${p.id}`})),
  ...HOODS.map(h => ({k:"Area", n:h[0], ja:h[1], c:h.ward?WARD[h.ward].color:"#999", a:`hood:${h.i}`, sub:h.ward?WARD[h.ward].en:h.tama})),
  ...GEO.japan.map(p => ({k:"Prefecture", n:p.en, ja:p.ja, c:"#888", a:`pref:${p.id}`})),
  ...CITIES.map(c => ({k:"City", n:c.n, ja:c.ja, c:"#3e63dd", a:`city:${c.id}`})),
  ...DAYTRIPS.map(c => ({k:"Day trip", n:c.n, ja:c.ja, c:"#d93b3b", a:`trip:${c.id}`})),
  ...LINES.flatMap(l => l.st.filter(s=>s[0]).map(s => ({k:"Station", n:s[0]+" Stn", ja:s[1], c:l.c, a:`stn:${s[2]},${s[3]}`, sub:l.n})))
].filter((x,i,arr) => arr.findIndex(y => y.n===x.n && y.k===x.k) === i);
ACT.pref = id => { if (+id===13) return goTokyo(); prefLayer.eachLayer(l => { if (l.feature.properties.id===+id) flyB(l.getBounds()); }); };
ACT.stn = v => { const [a,b] = v.split(",").map(Number); setLayer("lines", true); flyPt([a,b], 15.5); };
const q = $("#q"), res = $("#results"); let selI = 0, hits = [];
function closeSearch(){ res.classList.remove("on"); }
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); if (!s){ closeSearch(); return; }
  const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[-\s]/g,"");
  const ns = norm(s);
  hits = IDX.map(x => { const n = norm(x.n); const sc = n.startsWith(ns) ? 0 : n.includes(ns) ? 1 : (x.ja && x.ja.includes(s)) ? 1 : 9; return [sc,x]; })
    .filter(h => h[0] < 9).sort((a,b) => a[0]-b[0] || ["Ward","Area","Place","City","Prefecture","Day trip","Station"].indexOf(a[1].k) - ["Ward","Area","Place","City","Prefecture","Day trip","Station"].indexOf(b[1].k)).slice(0,12).map(h=>h[1]);
  selI = 0;
  res.innerHTML = hits.length ? hits.map((x,i) => `<button class="res ${i===0?'sel':''}" data-a="${x.a}"><span class="dot" style="background:${x.c}"></span><span class="t"><b>${esc(x.n)}</b><span class="jp">${esc(x.ja||"")}</span>${x.sub?`<span>${esc(x.sub)}</span>`:""}</span><em>${x.k}</em></button>`).join("") : `<div class="empty" style="padding:14px">No match</div>`;
  res.classList.add("on");
});
q.addEventListener("keydown", e => {
  const items = res.querySelectorAll(".res"); if (!items.length) return;
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); items[selI].classList.remove("sel"); selI = (selI + (e.key==="ArrowDown"?1:-1) + items.length) % items.length; items[selI].classList.add("sel"); items[selI].scrollIntoView({block:"nearest"}); }
  if (e.key==="Enter"){ items[selI].click(); q.blur(); q.value=""; }
  if (e.key==="Escape"){ closeSearch(); q.blur(); }
});
q.addEventListener("focus", () => { if (isMobile()) sheet("max"); if (q.value) res.classList.add("on"); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) closeSearch(); if (!e.target.closest("#layers,#layersBtn")) $("#layers").classList.remove("on"); });
res.addEventListener("click", () => { q.value = ""; });

/* ================= Layers popover ================= */
const LAYERDEF = [
  ["places","Tourist places",`${PLACES.length} spots in 8 categories`, ICON.star],
  ["lines","Train lines","Yamanote loop + key lines", ICON.train],
  ["narita","Narita route","Airport → Iriya", ICON.plane],
  ["hotel","Your hotel","Iriya", ICON.bed],
  ["hoods","Neighbourhood names","Ginza, Asakusa, Harajuku…", ICON.tag],
  ["streets","Street-level labels","Map labels when zoomed right in", ICON.map]
];
function renderLayers(){
  $("#layers").innerHTML = LAYERDEF.map(([k,n,s,ic]) => `<button class="lt ${layersOn[k]?'on':''}" data-l="${k}"><span class="sw">${svg(ic)}</span><span><b>${n}</b><small>${s}</small></span><span class="tog"></span></button>`).join("")
   + `<div class="legend">${LINES.map(l => `<div><i style="--c:${l.c}"></i>${esc(l.n)} <span class="jp" style="color:var(--muted)">${esc(l.ja)}</span></div>`).join("")}<div><i style="--c:#005aaa"></i>Keisei Skyliner (Narita)</div></div>`;
}
function setLayer(k, on){ layersOn[k] = on; store.set("tm-layers", layersOn); renderLayers(); onZoom(); }
$("#layers").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b){ e.stopPropagation(); setLayer(b.dataset.l, !layersOn[b.dataset.l]); } });
$("#layersBtn").addEventListener("click", e => { e.stopPropagation(); renderLayers(); $("#layers").classList.toggle("on"); });
$("#zin").onclick = () => map.zoomIn(); $("#zout").onclick = () => map.zoomOut();
function updateSeg(){ document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.a === (mode==="japan"?"japan":"tokyo"))); }

/* ================= Hint ================= */
let hintT; function hint(html){ const h = $("#hint"); h.innerHTML = `<i></i><span>${html}</span>`; h.classList.remove("hide"); clearTimeout(hintT); hintT = setTimeout(() => h.classList.add("hide"), 5200); }
map.on("dragstart", () => $("#hint").classList.add("hide"));

/* ================= Mobile sheet ================= */
let sheetState = "mid";
const SNAP = () => ({min:148, mid:Math.round(innerHeight*.46), max:Math.round(innerHeight*.9)});
function sheet(st){ if (!isMobile()) return; sheetState = st; panel.style.setProperty("--sh", SNAP()[st] + "px"); document.documentElement.style.setProperty("--sh", SNAP()[st] + "px"); }
(() => {
  const hd = $("#handle"); let y0, h0, moved;
  hd.addEventListener("pointerdown", e => { y0 = e.clientY; h0 = panel.getBoundingClientRect().height; moved=false; hd.setPointerCapture(e.pointerId); panel.classList.add("drag"); });
  hd.addEventListener("pointermove", e => { if (y0==null) return; const dy = y0 - e.clientY; if (Math.abs(dy)>4) moved=true;
    const h = Math.max(110, Math.min(innerHeight*.94, h0 + dy)); panel.style.setProperty("--sh", h+"px"); document.documentElement.style.setProperty("--sh", h+"px"); });
  const end = e => { if (y0==null) return; panel.classList.remove("drag"); const h = panel.getBoundingClientRect().height, s = SNAP();
    if (!moved){ sheet(sheetState==="min"?"mid":sheetState==="mid"?"max":"min"); }
    else sheet(Object.entries(s).sort((a,b) => Math.abs(a[1]-h)-Math.abs(b[1]-h))[0][0]);
    y0 = null; };
  hd.addEventListener("pointerup", end); hd.addEventListener("pointercancel", end);
})();
addEventListener("resize", () => { if (isMobile()) sheet(sheetState); });

/* ================= Collapsible panel ================= */
function setCollapsed(on){ if (isMobile()){ sheet(on ? "min" : "mid"); return; }
  document.body.classList.toggle("collapsed", on); store.set("tm-collapsed", on); }
$("#collapse").addEventListener("click", () => setCollapsed(true));
$("#openPanel").addEventListener("click", () => setCollapsed(false));
addEventListener("keydown", e => { if (e.key === "\\" && !e.target.closest("input")) setCollapsed(!document.body.classList.contains("collapsed")); });
if (!isMobile() && store.get("tm-collapsed", false)) document.body.classList.add("collapsed");

/* ================= Theme ================= */
darkMQ.addEventListener?.("change", () => { if (!usingOSM) base.setUrl(tileUrl("nolabels")); streetLabels.setUrl(tileUrl("labels")); prefLayer.setStyle(prefStyle); restyleWards(); tamaLayer.setStyle(tamaStyle); buildLines(); onZoom(); show(view,false); });

/* ================= Boot ================= */
$("#searchIcon").innerHTML = ICON.search;
$("#layersBtn").innerHTML = svg(ICON.layers) + "<span>Layers</span>";
$("#zin").innerHTML = svg(ICON.plus); $("#zout").innerHTML = svg(ICON.minus);
sheet("mid");
map.fitBounds(JAPAN_B, pad());
onZoom(); show({type:"japan"}, false);
setTimeout(() => hint("Tap the red <b>Tokyo</b> pin to dive in"), 900);

</script>
</body>
</html>
